name: Update Coding Time

on:
  schedule:
    - cron: "0 0 1 1 *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calculate years
        run: |
          START_YEAR=2019
          CURRENT_YEAR=$(date -u +%Y)
          YEARS=$((CURRENT_YEAR - START_YEAR))

          echo "{\"years\": $YEARS}" > experience.json

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experience.json
          git diff --cached --quiet || git commit -m "Update coding experience"
          git push
